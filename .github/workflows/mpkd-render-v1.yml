name: MPKD Render v1 Contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render-v1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run behavioral render tests
        run: python -m unittest discover -s tests/python -p 'test_render_scene_builder.py' -v
      - name: Validate manifest contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("schemas/mpkd-render-v1.json"))
          assert p["$id"]=="mpkd-render/v1"
          states=set(p["properties"]["objects"]["items"]["properties"]["verification_state"]["enum"])
          assert states == {"VERIFIED","PENDING","PLACEHOLDER","BLOCKED","CONFLICT"}
          print("mpkd-render/v1 manifest contract: OK")
          PY
