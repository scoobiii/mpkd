name: Performance Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: k6 performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start application
        run: |
          NODE_ENV=production npm run dev > /tmp/mpkd-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mpkd-server.log
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 performance smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
        run: k6 run k6/performance-smoke.js

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpkd-performance-server-log
          path: /tmp/mpkd-server.log
          if-no-files-found: ignore
