name: MPKD CAD Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mpkd-cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run CAD contract tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
